name: Migrar mídias do site antigo

# Baixa os vídeos, capas e prévias do site antigo (rodsaudiovisual.com) para
# public/media, valida cada arquivo e faz commit do resultado na própria branch.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/migrate-media.yml
      - scripts/fetch-media.mjs
      - src/content/imported/**

permissions:
  contents: write

concurrency:
  group: migrate-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Baixar mídias
        run: npm run media:fetch

      - name: Verificar mídias
        run: npm run media:check

      - name: Relatório técnico dos vídeos (resolução, duração, áudio)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          {
            echo "# Relatório das mídias migradas"
            echo
            echo "Gerado automaticamente pelo workflow migrate-media em $(date -u +%Y-%m-%dT%H:%MZ)."
            echo
            echo "| Arquivo | Tamanho | Resolução | Duração | Áudio |"
            echo "|---|---|---|---|---|"
            for f in $(find public/media -name '*.mp4' | sort); do
              size=$(du -h "$f" | cut -f1)
              res=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$f")
              dur=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f" | xargs printf '%.1fs')
              audio=$(ffprobe -v error -select_streams a -show_entries stream=codec_name -of csv=p=0 "$f" | head -1)
              echo "| \`${f#public}\` | $size | $res | $dur | ${audio:-sem áudio} |"
            done
          } > docs/RELATORIO-MIDIAS.md
          cat docs/RELATORIO-MIDIAS.md
          du -sh public/media

      - name: Commit dos arquivos migrados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media src/content/media-manifest.json docs/RELATORIO-MIDIAS.md
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "Migra mídias do site antigo para public/media"
            git push
          fi
